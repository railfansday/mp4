name: Buat Video dari Keyword

on:
  workflow_dispatch:        # bisa run manual dari tab Actions
  push:
    paths:
      - 'keyword.txt'       # otomatis jalan kalau keyword.txt diubah

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      # 1. Checkout repo
      - name: Checkout
        uses: actions/checkout@v4

      # 2. Setup Python
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      # 3. Install FFmpeg (wajib untuk MoviePy)
      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      # 4. Install dependencies Python
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install icrawler moviepy Pillow

      # 5. Jalankan script
      - name: Build video
        run: python video_keyword.py

      # 6. Upload semua video hasil (video_*.mp4) sebagai artifact
      - name: Upload videos
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: video-keyword
          path: video_*.mp4
          retention-days: 7
          if-no-files-found: warn
