name: Text to Video Otomatis

on:
  workflow_dispatch:
  push:
    paths:
      - 'berita.txt'

jobs:
  build_video:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install FFmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y ffmpeg

      - name: Install Python deps
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build video
        run: python berita_to_video.py

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: berita-video
          path: output/berita_final.mp4
          retention-days: 7
          if-no-files-found: warn
