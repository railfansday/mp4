name: Scrape Gambar & Buat Video

on:
  workflow_dispatch: # Jalankan manual
  schedule:
    - cron: '0 0 * * *' # Opsional: Jalankan otomatis setiap hari jam 00:00 UTC

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-22.04
    timeout-minutes: 30

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Install FFmpeg (Wajib untuk MoviePy)
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Jalankan Scraper & Render Video
        run: python buat_video_otomatis.py

      # Simpan video hasil render ke GitHub
      - name: Commit & Push Video
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Hanya ambil file MP4
          git add *.mp4
          
          # Jika tidak ada video baru, hentikan
          git diff --staged --quiet && echo "Tidak ada video baru" && exit 0
          
          git commit -m "Update video otomatis [skip ci]"
          git push
