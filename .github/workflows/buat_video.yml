name: Buat Video Vertikal 1080x1920

on:
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions
  push:
    paths:
      - '*.jpg'
      - '*.png'
      - '*.jpeg'

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ PENTING: MoviePy butuh FFmpeg untuk render video
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Jalankan Skrip Video
        run: python buat_video.py

      # ✅ Simpan video MP4 ke repositori
      - name: Upload Video ke GitHub
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          git add video_1080x1920.mp4
          
          # Hentikan jika tidak ada video baru
          git diff --staged --quiet && echo "Tidak ada video baru" && exit 0
          
          git commit -m "Update video vertikal otomatis [skip ci]"
          git push
