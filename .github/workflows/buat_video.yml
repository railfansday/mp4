name: Text to Video Otomatis

on:
  workflow_dispatch: # Bisa dijalankan manual dari tab Actions

permissions:
  contents: write

jobs:
  build_video:
    runs-on: ubuntu-22.04
    timeout-minutes: 60 # Waktu dinaikkan karena TTS & rendering butuh waktu

    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      # ✅ Wajib untuk MoviePy
      - name: Install FFmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Jalankan Skrip Text to Video
        run: python text_to_video.py

      # ✅ Simpan video hasil render ke repositori
      - name: Commit & Push Video
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          
          # Ambil file MP4 hasil render
          git add *.mp4
          
          # Jika tidak ada perubahan/video baru, hentikan
          git diff --staged --quiet && echo "Tidak ada video baru" && exit 0
          
          git commit -m "Update video dari teks otomatis [skip ci]"
          git push
